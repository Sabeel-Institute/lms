version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
