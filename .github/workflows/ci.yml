# Rendered from Sabeel-Institute/ci-tools workflows/ci.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-validation:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  # Whether the pull request changes documentation alone (sabeel-ci
  # docs-only). Then integration and browser skip, and build-test passes over
  # them; quality runs either way, as its lint and unit tests read documents.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Does the pull request change documentation alone
        id: changes
        run: sabeel-ci docs-only

  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: What ci-tools assumes of the app
        run: sabeel-ci check-app
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dead-code audit
        run: npm run knip
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Unit tests
        run: npm test

  integration:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      - name: Emulator integration tests
        run: npm run test:emulator

  browser:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ["test:screens","test:e2e","test:e2e:push"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      - name: Emulator secret placeholders
        run: sabeel-ci emulator-secrets
      # Playwright's Chromium, kept per Playwright version. The libraries it
      # needs are on GitHub's Ubuntu image already, so apt is not run: its
      # mirrors held this step for over 5 minutes in one run in 10.
      # From its package.json: `npx playwright --version` prints npm's.
      - name: Which Playwright
        id: playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        timeout-minutes: 10
        run: npx --no playwright install chromium || { sleep 15; npx --no playwright install chromium; }
      - name: Browser suite
        env:
          SUITE: ${{ matrix.suite }}
        run: npm run "$SUITE"
      - name: Screens report, compared with main
        if: always() && matrix.suite == 'test:screens'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci screens-report shots/screens --baseline-from-main --out "$RUNNER_TEMP/screens-report"
      - name: Keep the screens report
        if: always() && matrix.suite == 'test:screens'
        uses: actions/upload-artifact@v7
        with:
          name: screens-report
          path: ${{ runner.temp }}/screens-report
          retention-days: 30
      - name: Screens and logs from the suite
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ strategy.job-index }}
          path: shots/
          retention-days: 7

  # Every job must pass, but for integration and browser on a pull request
  # the changes job found to be documentation alone, which skip. Anything
  # else skipped or cancelled fails it, as a skipped required check would
  # otherwise pass.
  build-test:
    if: always() && github.event.pull_request.draft != true
    needs: [workflow-validation, changes, quality, integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const names = ["workflow-validation", "changes", "quality", "integration", "browser"];
            const docsOnly = jobs.changes?.result === "success" && jobs.changes.outputs?.["docs-only"] === "true";
            const passed = (name) => jobs[name]?.result === "success" || (docsOnly && ["integration", "browser"].includes(name) && jobs[name]?.result === "skipped");
            if (Object.keys(jobs).length !== names.length || !names.every(passed)) process.exit(1);'
