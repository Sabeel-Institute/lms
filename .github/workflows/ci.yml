# Rendered from Sabeel-Institute/ci-tools workflows/ci.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-validation:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: What ci-tools assumes of the app
        run: sabeel-ci check-app
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dead-code audit
        run: npm run knip
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Unit tests
        run: npm test

  integration:
    if: github.event.pull_request.draft != true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      - name: Emulator integration tests
        run: npm run test:emulator

  browser:
    if: github.event.pull_request.draft != true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ["test:screens","test:e2e","test:e2e:push"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      # A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
      # release) instead of apt: the runners' apt mirror held one install for 41
      # minutes and stalls about one in five. ffprobe comes with it, as it does
      # with the distribution package.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
          curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
          printf '%s  %s\n' \
            bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
            25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
          gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      - name: Emulator secret placeholders
        run: sabeel-ci emulator-secrets
      # An apt mirror can stall a download indefinitely (one held this step
      # for 45 minutes). apt's own timeouts make it fail instead, and the
      # install runs once more. Stopping it from outside is no use: the
      # apt-get it starts runs as root, outlives the kill and keeps the lock.
      - name: Install Chromium
        timeout-minutes: 15
        run: |
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          npx playwright install --with-deps chromium || { sleep 15; npx playwright install --with-deps chromium; }
      - name: Browser suite
        env:
          SUITE: ${{ matrix.suite }}
        run: npm run "$SUITE"
      - name: Screens report, compared with main
        if: always() && matrix.suite == 'test:screens'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci screens-report shots/screens --baseline-from-main --out "$RUNNER_TEMP/screens-report"
      - name: Keep the screens report
        if: always() && matrix.suite == 'test:screens'
        uses: actions/upload-artifact@v7
        with:
          name: screens-report
          path: ${{ runner.temp }}/screens-report
          retention-days: 30
      - name: Screens and logs from the suite
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ strategy.job-index }}
          path: shots/
          retention-days: 7

  build-test:
    if: always() && github.event.pull_request.draft != true
    needs: [workflow-validation, quality, integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.JOB_RESULTS)); if (!jobs.length || jobs.some(job => job.result !== "success")) process.exit(1);'
