name: CI

# AUTOMATIC CI IS OFF while this repo is in heavy development (2026-08-28).
#
# Not because it was failing — it is green — but because it is about ten minutes
# a run and duplicates work already done locally:
# `npm run lint && npm run typecheck && npm run knip && npm test &&
# npm run test:emulator && npm run test:screens` covers everything below and
# more, on the machine where the change is being made. Waiting on a slower copy of a check you already ran is the whole cost.
#
# The job is intact and still runnable on demand — Actions tab -> CI -> Run
# workflow, or `gh workflow run ci.yml --ref <branch>`. Worth doing before a
# release, and before anything that has to hold on a clean machine (the sweep in
# particular has only ever been proven on this box and one GitHub runner).
#
# TO TURN IT BACK ON, restore:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
#   concurrency:
#     group: ci-${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#
# That is the narrowed form — a branch with no PR ran nothing, a draft PR ran
# nothing, repeated pushes to a PR cancelled the superseded run. It replaced a
# bare `push:` + `pull_request:` that billed TWO full jobs for every commit.
on:
  workflow_dispatch:

jobs:
  build-test:
    # A draft PR is work in progress; mark it ready for review to spend CI on it.
    # (On a push event `github.event.pull_request` is null, so this is true and
    # main still runs.)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Keeps the dead-code audit from rotting. knip.json teaches it this
      # stack's shapes (platform seams and scripts are entry points) — read the
      # comments there before "fixing" anything it reports.
      - name: Dead-code audit (knip)
        run: npm run knip

      - name: Unit tests
        run: npm test

      # The local media store the emulator suites run against (stand-in for
      # Cloudflare R2). The pinned release, checked against GitHub's digest.
      - name: Install SeaweedFS
        run: |
          curl -sSLo weed.tgz https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs" && tar -xzf weed.tgz -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"

      # Secrets the functions bind, as the emulator wants them: present, and
      # never fetched from Secret Manager. Sentry off; the media keys are unused
      # under the emulator (mediaStore.ts reads the local SeaweedFS keys).
      - name: Emulator secret placeholders
        run: |
          printf '%s\n' SENTRY_DSN=disabled R2_READ_KEY_ID=unused-in-emulator \
            R2_READ_SECRET=unused-in-emulator R2_WRITE_KEY_ID=unused-in-emulator \
            R2_WRITE_SECRET=unused-in-emulator > functions/.secret.local

      # Firestore rules, the callables, and the media store's signed URLs.
      - name: Emulator integration tests
        run: npm run test:emulator

      # Chromium only — the sweep drives one browser and the other two are a
      # minute of download each. `--with-deps` because a bare runner has none of
      # the shared libraries headless Chromium links against.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The multi-width layout sweep: every screen of both populations at five
      # widths straddling the content-column breakpoint, ASSERTED rather than
      # merely screenshotted.
      #
      # It can be here — where `test:e2e` below cannot — because it starts its
      # own emulator suite and its own web dev server and owns both for one run,
      # instead of expecting a world somebody else built and then wiping it.
      # `functions/test/unit/ciCoverage.test.ts` fails if this step is ever
      # dropped, which is the only thing that keeps a suite from quietly
      # becoming a file.
      - name: Screens sweep (multi-width layout regression)
        run: bash scripts/screens-e2e.sh

      # Screens as the sweep saw them, for reading a failure without
      # re-deriving it locally. Uploaded on failure only: a green run's shots
      # are 100+ PNGs nobody opens.
      - name: Upload sweep screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-sweep
          path: shots/screens/
          retention-days: 7

      # `npm run test:e2e` is deliberately NOT run here. It needs a live Metro
      # dev server AND a long-running emulator suite that something else
      # started, and it resets Firestore and Auth on every run — but
      # `test:emulator` above frees those same ports, so the two cannot share a
      # job. It is a local pre-commit check; see docs/DEV-TOOLING.md.
