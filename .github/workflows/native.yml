# Rendered from Sabeel-Institute/ci-tools workflows/native.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - maestro/**
      - scripts/seed-emulator-world.mjs
      - ci-tools.json
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  android:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Android SDK packages, with retries
        run: sabeel-ci ci-android-sdk
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      # The app's Firebase app files, where it commits none: the pre-merge build's
      # demo ones, which the debug build only needs to compile against.
      - name: Placeholder Firebase app configuration
        run: if [ ! -f app/google-services.json ]; then sabeel-ci ci-premerge prepare; fi
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      - name: Emulator secret placeholders
        env:
          SECRETS: '{"SENTRY_DSN":"disabled","R2_READ_KEY_ID":"unused-in-emulator","R2_READ_SECRET":"unused-in-emulator","R2_WRITE_KEY_ID":"unused-in-emulator","R2_WRITE_SECRET":"unused-in-emulator","APNS_KEY":"unused-in-emulator"}'
        run: |
          node -e 'const secrets = JSON.parse(process.env.SECRETS); require("node:fs").writeFileSync("functions/.secret.local", Object.entries(secrets).map(([name, value]) => name + "=" + value + "\n").join(""))'
      - name: Install Chromium for the seed
        run: npx playwright install --with-deps chromium
      - name: Boot an Android emulator
        run: sabeel-ci ci-avd
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows
        run: sabeel-ci native-e2e
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  ios:
    if: github.repository_owner == 'Sabeel-Institute' && (startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The app's Firebase app files, where it commits none: the pre-merge build's
      # demo ones, which the debug build only needs to compile against.
      - name: Placeholder Firebase app configuration
        run: if [ ! -f app/google-services.json ]; then sabeel-ci ci-premerge prepare; fi
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      - name: Install ffmpeg
        run: brew install --quiet ffmpeg
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/darwin_arm64.tar.gz
          echo "3ad466db33e83d0b103f90a06997feeb1cc42fd536e6cbdcdded975778f64fda  $RUNNER_TEMP/weed.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      - name: Emulator secret placeholders
        env:
          SECRETS: '{"SENTRY_DSN":"disabled","R2_READ_KEY_ID":"unused-in-emulator","R2_READ_SECRET":"unused-in-emulator","R2_WRITE_KEY_ID":"unused-in-emulator","R2_WRITE_SECRET":"unused-in-emulator","APNS_KEY":"unused-in-emulator"}'
        run: |
          node -e 'const secrets = JSON.parse(process.env.SECRETS); require("node:fs").writeFileSync("functions/.secret.local", Object.entries(secrets).map(([name, value]) => name + "=" + value + "\n").join(""))'
      - name: Install Chromium for the seed
        run: npx playwright install chromium
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows on the iOS simulator
        run: sabeel-ci native-e2e --ios
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.sha }}
          path: |
            shots/native/
            !shots/native/ios-build/
          retention-days: 14
