name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - maestro/**
      - scripts/native-e2e.sh
      - scripts/seed-emulator-world.mjs
      - scripts/ci-avd.sh
      - scripts/install-maestro.sh
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  android:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      - name: Placeholder Firebase app configuration
        run: node scripts/ci-premerge.mjs prepare
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install SeaweedFS
        run: |
          curl -fsSLo "$RUNNER_TEMP/weed.tgz" https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
          echo "31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d  $RUNNER_TEMP/weed.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          tar -xzf "$RUNNER_TEMP/weed.tgz" -C "$RUNNER_TEMP/seaweedfs"
          echo "WEED_BIN=$RUNNER_TEMP/seaweedfs/weed" >> "$GITHUB_ENV"
      - name: Emulator secret placeholders
        run: |
          printf '%s\n' SENTRY_DSN=disabled R2_READ_KEY_ID=unused-in-emulator \
            R2_READ_SECRET=unused-in-emulator R2_WRITE_KEY_ID=unused-in-emulator \
            R2_WRITE_SECRET=unused-in-emulator APNS_KEY=unused-in-emulator \
            > functions/.secret.local
      - name: Install Chromium for the seed
        run: npx playwright install --with-deps chromium
      - name: Boot an Android emulator
        run: bash scripts/ci-avd.sh
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Native flows
        run: bash scripts/native-e2e.sh
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14
