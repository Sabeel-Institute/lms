# Rendered from Sabeel-Institute/ci-tools workflows/web.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'Sabeel-Institute'
    environment: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Restore production build configuration
        env:
          APP_ENV_LOCAL: ${{ secrets.APP_ENV_LOCAL }}
        run: sabeel-ci ci-platform prepare-web
      - run: npm ci
      # The site, and beside it its source maps for Deploy Web to upload.
      - name: Build and checksum Hosting artifact
        run: sabeel-ci ci-platform web
      # Kept 90 days, GitHub's longest for a public repository: the Nightly
      # workflow checks the live site against the build of its commit.
      - uses: actions/upload-artifact@v7
        with:
          name: web-hosting-${{ github.sha }}
          path: ${{ runner.temp }}/web-artifact
          if-no-files-found: error
          retention-days: 90
