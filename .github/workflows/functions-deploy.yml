# Rendered from Sabeel-Institute/ci-tools workflows/functions-deploy.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy main's functions to production (false checks access and plans the deploy only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_owner == 'Sabeel-Institute'
    environment: functions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Only the owner releases
        env:
          OWNER_ID: ${{ vars.RELEASE_OWNER_ID }}
          OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$OWNER_ID" ] || [ "$ACTOR_ID" != "$OWNER_ID" ] || [ "$TRIGGERING_ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::Only the organization owner starts or re-runs a release; this run is $TRIGGERING_ACTOR's."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Require a successful CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci ci-functions require-ci
      - name: Install dependencies
        run: npm ci
      - run: npm install --global firebase-tools@^15
      - name: Functions environment kept out of the repository
        env:
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
        run: |
          if [ -n "$PROBE_TOKEN" ]; then
            printf 'PROBE_TOKEN=%s\n' "$PROBE_TOKEN" > functions/.env
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_FUNCTIONS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FUNCTIONS_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Plan the deploy; never delete a live function
        run: sabeel-ci ci-functions plan
      - name: Check the deploy without changing anything
        if: ${{ !inputs.deploy }}
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --dry-run
      - name: Deploy the functions
        if: inputs.deploy
        run: |
          echo "DEPLOY_STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
      - name: Post-deployment checks
        if: inputs.deploy && !cancelled() && env.DEPLOY_STARTED != ''
        env:
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
        run: sabeel-ci ci-functions verify --since "$DEPLOY_STARTED"
