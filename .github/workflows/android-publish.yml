# Rendered from Sabeel-Institute/ci-tools workflows/android-publish.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Publish Android

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android workflow run ID from main
        required: true
        type: string
      publish:
        description: Release to Play internal testing (false checks permissions without uploading)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_owner == 'Sabeel-Institute'
    environment: play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PUBLISH_PLAY: ${{ inputs.publish }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Only the owner releases
        env:
          OWNER_ID: ${{ vars.RELEASE_OWNER_ID }}
          OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$OWNER_ID" ] || [ "$ACTOR_ID" != "$OWNER_ID" ] || [ "$TRIGGERING_ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::Only the organization owner starts or re-runs a release; this run is $TRIGGERING_ACTOR's."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Android build provenance and successful CI
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci ci-platform resolve-android-build
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-aab-${{ steps.build.outputs.sha }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/play-artifact
      - name: Install checksum-pinned Google bundletool
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum --check
          echo "BUNDLETOOL_JAR=$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
      - name: Verify AAB checksum, signature, package, version and commit
        run: sabeel-ci ci-play verify
      - name: Check Play access or publish to internal testing
        env:
          PLAY_PUBLISHER_JSON: ${{ secrets.PLAY_PUBLISHER_JSON }}
          PLAY_PUBLISHER_ACCOUNT: ${{ vars.PLAY_PUBLISHER_ACCOUNT }}
        run: sabeel-ci ci-play release
