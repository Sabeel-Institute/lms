# Rendered from Sabeel-Institute/ci-tools workflows/premerge.yml by
# `npx sabeel-ci workflows`: edit it there, not here.
name: Pre-merge Builds

on:
  # Main's pushes record the native inputs that compiled there, for every
  # pull request after them.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_DOTENV: "1"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  compatibility:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Validate SDK dependency compatibility
        run: sabeel-ci ci-premerge sdk
      - name: Install and load the backend as Cloud Build does
        run: sabeel-ci ci-premerge backend

  # The Expo fingerprint of the native inputs each platform's release build
  # compiles (the native-fingerprint command), and whether a release build of
  # the same inputs compiled already: on main, or earlier in this pull
  # request. A platform whose inputs compiled leaves only its JavaScript to
  # check, which the javascript job compiles on every run.
  fingerprint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      android: ${{ steps.keys.outputs.android }}
      ios: ${{ steps.keys.outputs.ios }}
      android-compiled: ${{ steps.android.outputs.cache-hit }}
      ios-compiled: ${{ steps.ios.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Prepare public test configuration
        run: sabeel-ci ci-premerge prepare
      - run: npm ci
      - name: Fingerprint the native inputs
        id: keys
        run: sabeel-ci native-fingerprint release
      - name: Did a release build of the Android inputs compile
        id: android
        uses: actions/cache/restore@v6
        with:
          path: ~/release-compiled
          key: ${{ steps.keys.outputs.android }}
          lookup-only: true
      - name: Did a release build of the iOS inputs compile
        id: ios
        uses: actions/cache/restore@v6
        with:
          path: ~/release-compiled
          key: ${{ steps.keys.outputs.ios }}
          lookup-only: true

  javascript:
    if: github.event.pull_request.draft != true
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Compile production web export
        run: npm run web:export -w @sabeel/app
      - name: Compile production JavaScript for Android and iOS
        run: sabeel-ci ci-premerge bundles

  android:
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.android-compiled != 'true'
    needs: [compatibility, fingerprint]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare public test configuration and disable signing
        run: sabeel-ci ci-premerge prepare
      - run: npm ci
      - name: Android SDK packages, with retries
        run: sabeel-ci ci-android-sdk
      - name: Compile and verify unsigned release AAB
        run: sabeel-ci ci-premerge android
      - name: Record that these native inputs compiled
        run: mkdir -p ~/release-compiled && echo "$GITHUB_SHA" > ~/release-compiled/commit
      - uses: actions/cache/save@v6
        with:
          path: ~/release-compiled
          key: ${{ needs.fingerprint.outputs.android }}

  ios:
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.ios-compiled != 'true'
    needs: [compatibility, fingerprint]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: ci-tools, at the commit package-lock.json pins
        run: |
          sha=$(jq -er '.packages["node_modules/@sabeel-institute/ci-tools"].resolved | capture("#(?<sha>[0-9a-f]{40})$").sha' package-lock.json)
          git clone --quiet --no-checkout https://github.com/Sabeel-Institute/ci-tools.git "$RUNNER_TEMP/ci-tools"
          if ! git -C "$RUNNER_TEMP/ci-tools" merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::ci-tools $sha is not on ci-tools' main branch"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ci-tools" checkout --quiet --detach "$sha"
          npm ci --prefix "$RUNNER_TEMP/ci-tools" --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/ci-tools-bin"
          ln -s "$RUNNER_TEMP/ci-tools/bin/sabeel-ci.mjs" "$RUNNER_TEMP/ci-tools-bin/sabeel-ci"
          echo "$RUNNER_TEMP/ci-tools-bin" >> "$GITHUB_PATH"
      - name: Prepare public test configuration
        run: sabeel-ci ci-premerge prepare
      - run: npm ci
      - name: Compile and verify unsigned device Release archive
        run: sabeel-ci ci-premerge ios
      - name: Record that these native inputs compiled
        run: mkdir -p ~/release-compiled && echo "$GITHUB_SHA" > ~/release-compiled/commit
      - uses: actions/cache/save@v6
        with:
          path: ~/release-compiled
          key: ${{ needs.fingerprint.outputs.ios }}

  # Every job must pass, but for a platform the fingerprint job found
  # compiled already, which is skipped. Anything else skipped or cancelled
  # fails it, as a skipped required check would otherwise pass.
  premerge-builds:
    if: always() && github.event.pull_request.draft != true
    needs: [compatibility, fingerprint, javascript, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every pre-merge validation job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const names = ["compatibility", "fingerprint", "javascript", "android", "ios"];
            const compiled = (name) => jobs.fingerprint?.result === "success" && jobs.fingerprint.outputs?.[name + "-compiled"] === "true";
            const passed = (name) => jobs[name]?.result === "success" || (["android", "ios"].includes(name) && jobs[name]?.result === "skipped" && compiled(name));
            if (Object.keys(jobs).length !== names.length || !names.every(passed)) process.exit(1);'
