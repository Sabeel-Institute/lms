# A student on Android: a password sign-in, a recording that keeps playing in
# the background and resumes its place, the class list and Change password.
# Seeded by scripts/seed-emulators.mjs; run by `npx sabeel-ci native-e2e`.
appId: ${APP_ID}
name: Student signs in, listens, and changes the password
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
- tapOn: "you@example.com"
- inputText: "abd.al.rahman.ibn.muhammad.al.shinqiti@example.com"
# Next moves the focus to the password; on iOS Maestro can type before the
# focus lands there, so the flow puts it there itself. Go signs in.
- pressKey: Enter
- tapOn:
    id: "signin-password"
- inputText: "HikamStudent1"
- pressKey: Enter
# A card's texts are one accessibility label on iOS, and Maestro matches the
# whole label, so texts inside a card or a row are matched as part of one.
- extendedWaitUntil:
    visible: "Play Session 2 — Knowledge and Certainty[\\s\\S]*"
    timeout: 60000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- takeScreenshot: 01-home

# Playback reaches the audio, and keeps time behind Home.
- tapOn: "Play Session 2 — Knowledge and Certainty[\\s\\S]*"
- extendedWaitUntil:
    visible: "Bookmark this place"
    timeout: 30000
- tapOn: "Play"
- extendedWaitUntil:
    visible: "0:0[3-9]"
    timeout: 30000
- takeScreenshot: 02-playing
- pressKey: Home
- runFlow:
    file: common/wait.yaml
    env:
      SECONDS: 15
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "0:(1[5-9]|[2-5][0-9])"
    timeout: 15000
- tapOn: "Pause"
- takeScreenshot: 03-after-background
- runFlow: common/back.yaml

# The classes, and Change password reports what really happened.
- tapOn: "Classes"
- assertVisible: "Your classes"
- tapOn: "More"
- tapOn: "Change password[\\s\\S]*"
- extendedWaitUntil:
    visible: "Reset link sent[\\s\\S]*"
    timeout: 30000
- takeScreenshot: 04-password-link
