# Back one screen: the header's back arrow on Android ("Navigate up"); on iOS
# the edge swipe every native-stack screen answers, whatever its back button is
# labelled.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Navigate up"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 85%, 45%
          duration: 400
