# A debug build shows "Open debugger to view warnings" over the tab bar when the
# app logs a warning, and the toast takes the taps meant for the tabs under it.
# Close it when it is there.
appId: com.sabeelinstitute.lms
---
- runFlow:
    when:
      visible: "Open debugger to view warnings\\."
    commands:
      - tapOn:
          rightOf: "Open debugger to view warnings\\."
