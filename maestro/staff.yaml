# Staff: the dev sign-in row, the day's queue, a session's register, and the
# institute's lists. Seeded by scripts/seed-emulators.mjs; run by `npx
# sabeel-ci native-e2e`. Each step that moves the app on checks that it did
# (ci-tools/tap-until.yaml, back-until.yaml): a busy CI simulator drops taps
# that land before a screen takes them.
appId: ${APP_ID}
name: Staff work through the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "as faisal.shah \\(first admin\\)"
      EXPECT: "ATTENDANCE NOT TAKEN[\\s\\S]*"
      SECONDS: 60
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- takeScreenshot: 01-today

- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "[\\s\\S]*Session 5 — Reliance and Trust[\\s\\S]*"
      EXPECT: "ATTENDANCE"
      SECONDS: 30
- assertVisible: "[\\s\\S]*Present"
- takeScreenshot: 02-register
- runFlow:
    file: ci-tools/back-until.yaml
    env:
      FROM: "ATTENDANCE"

- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Courses"
      EXPECT: "Add a cohort"
      SECONDS: 30
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "People"
      EXPECT: "STUDENTS[\\s\\S]*"
      SECONDS: 30
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "More"
      EXPECT: "Audit history[\\s\\S]*"
      SECONDS: 30
- takeScreenshot: 03-more

# THE GIVE LIST'S DATE: the one date field that sits in a sheet rather than
# on a screen. On Android the system's date dialog has to open above the sheet
# and hand its date back; on iOS the field opens its own sheet with the
# calendar (DateField.ios.tsx), above the give list, and Done hands it back.
# More is a sheet over the screen it came from: closed by its ×, or the tab
# bar under it takes no tap.
- tapOn: "Close"
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Courses"
      EXPECT: "Add a cohort"
      SECONDS: 30
- tapOn:
    id: "cohort-open-Autumn 2026"
- extendedWaitUntil:
    visible:
      id: "course-open-Hikam Foundations"
    timeout: 30000
- tapOn:
    id: "course-open-Hikam Foundations"
- extendedWaitUntil:
    visible:
      id: "nav-sessions"
    timeout: 30000
- tapOn:
    id: "nav-sessions"
- scrollUntilVisible:
    element:
      id: "session-open-Session 10 — Thankfulness in Ease"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "session-open-Session 10 — Thankfulness in Ease"
- scrollUntilVisible:
    element:
      id: "recording-ledger"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "recording-ledger"
- scrollUntilVisible:
    element:
      id: "given-add"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "given-add"
- extendedWaitUntil:
    visible:
      id: "datefield-open"
    timeout: 20000
- takeScreenshot: 04-give-list
- tapOn:
    id: "datefield-open"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "OK"
          timeout: 20000
      - takeScreenshot: 05-date-dialog
      - tapOn: "OK"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "datefield-done"
          timeout: 20000
      - takeScreenshot: 05-date-sheet
      - tapOn:
          id: "datefield-done"
# Back in the give list, with a date in the field and Give on offer.
- extendedWaitUntil:
    visible:
      id: "datefield-open"
      text: "Open until: \\d{4}-\\d{2}-\\d{2}"
    timeout: 20000
- assertVisible:
    id: "give-submit"
- takeScreenshot: 06-date-chosen
