# Staff on Android: the dev sign-in row, the day's queue, a session's
# register, and the institute's lists. Seeded by
# scripts/seed-emulator-world.mjs; run by `npx sabeel-ci native-e2e`.
appId: ${APP_ID}
name: Staff work through the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
- tapOn: "as faisal.shah \\(first admin\\)"
- extendedWaitUntil:
    visible: "ATTENDANCE NOT TAKEN[\\s\\S]*"
    timeout: 60000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- takeScreenshot: 01-today

- tapOn: "[\\s\\S]*Session 5 — Reliance and Trust[\\s\\S]*"
- extendedWaitUntil:
    visible: "ATTENDANCE"
    timeout: 30000
- assertVisible: "[\\s\\S]*Present"
- takeScreenshot: 02-register
- runFlow: common/back.yaml

- tapOn: "Courses"
- assertVisible: "Add a cohort"
- tapOn: "People"
- assertVisible: "STUDENTS[\\s\\S]*"
- tapOn: "More"
- assertVisible: "Audit history[\\s\\S]*"
- takeScreenshot: 03-more
