// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Processes google-services.json (Android OAuth client for staff Google
    // Sign-In; FCM sender for Phase 7). The JSON is gitignored.
    classpath('com.google.gms:google-services:4.4.4')
    // Sentry's Android Gradle plugin, at the version @sentry/react-native pairs
    // with its Android SDK (sentryAndroidGradlePluginVersion in its Expo plugin;
    // `sabeel-ci check-app` holds the two equal). app/build.gradle says what it does.
    classpath('io.sentry:sentry-android-gradle-plugin:5.12.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
