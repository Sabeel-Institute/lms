apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "io.sentry.android.gradle"
apply plugin: "com.google.gms.google-services"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * A release uploads its JavaScript source map to Sentry, so a crash reads as
 * source rather than as the minified bundle. sentry.gradle does it, applied
 * exactly when the build machine's `app/.env.sentry-build-plugin` exists: that
 * file holds the token (SENTRY_AUTH_TOKEN), and ci-tools' `build-aab` sets
 * SENTRY_ORG and SENTRY_PROJECT from ci-tools.json and refuses a release
 * without the file. A pull-request build has no file and applies nothing.
 * docs/SECRETS.md says where the file comes from.
 */
if (file("$projectRoot/.env.sentry-build-plugin").exists()) {
    apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute(null, rootDir).text.trim(), "../sentry.gradle")
}

/**
 * The app version has ONE source of truth: app.json → expo.version. Nothing
 * here carries its own copy — two copies desync silently, and the symptom is
 * every release reporting the same version to Sentry.
 *
 * versionCode gives each field three digits. Two digits collide (0.1.100 and
 * 0.2.0 both give 200), and Android refuses to install an APK whose versionCode
 * is not greater than the installed one — so that release simply never goes out.
 * Widening the multipliers later is safe; narrowing them never is.
 *
 * These checks are also `npx sabeel-ci check-version` (ci-tools'
 * lib/version.mjs) on purpose: that one must catch a web-only release that never
 * runs Gradle, and this one must fail even when nobody ran it — which is exactly
 * the case where a hole here matters. The regex below must stay
 * CHARACTER-IDENTICAL to the one there.
 *
 * It rejects leading zeros, which the naive /^\d+\.\d+\.\d+$/ accepts:
 * `2026.07.01` is three dot-separated integers, but 07 and 7 are the same
 * number, so 2026.07.01 and 2026.7.1 compute the SAME versionCode.
 */
def expoVersion = new groovy.json.JsonSlurper()
    .parse(file("$projectRoot/app.json")).expo.version
if (!expoVersion.matches(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)) {
    throw new GradleException(
        "app.json version '${expoVersion}' must be exactly three integers (X.Y.Z) " +
        "with no leading zeros — no pre-release suffix, no fourth component, no " +
        "date-style components. See npx sabeel-ci check-version.")
}
def (vMajor, vMinor, vPatch) = expoVersion.tokenize('.').collect { it.toInteger() }
// Major at most 2100 keeps the sum below Integer.MAX_VALUE before it is compared.
if (vMinor > 999 || vPatch > 999 || vMajor > 2100 || vMajor * 1000000 + vMinor * 1000 + vPatch > 2100000000) {
    throw new GradleException(
        "app.json version '${expoVersion}' overflows the versionCode scheme " +
        "(minor and patch at most 999, the code at most 2100000000, Play's limit).")
}
def computedVersionCode = vMajor * 1000000 + vMinor * 1000 + vPatch

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.sabeelinstitute.lms'
    defaultConfig {
        applicationId 'com.sabeelinstitute.lms'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName expoVersion

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    /**
     * Release builds sign with the app's own key, never the debug one.
     *
     * The debug keystore is public — it is committed here and ships with every
     * Android SDK — so a release signed with it could be rebuilt by anyone and
     * installed OVER the real app as an update. The release key lives outside
     * the repo, in `~/.config/sabeel-lms/` (or wherever
     * SABEEL_KEYSTORE_PROPERTIES points, as ci-tools' `ci-platform` sets it in
     * CI), and docs/SECRETS.md says what it is and how it is backed up.
     * Without that file the release signing config stays empty, and the
     * `gradle.taskGraph.whenReady` check after this block stops the release:
     * fail closed, never fall back to the debug key. Debug builds are
     * unaffected.
     */
    def releaseKeyProps = new Properties()
    def releaseKeyFile = file(System.getenv('SABEEL_KEYSTORE_PROPERTIES')
        ?: "${System.getProperty('user.home')}/.config/sabeel-lms/keystore.properties")
    if (releaseKeyFile.exists()) {
        releaseKeyFile.withInputStream { releaseKeyProps.load(it) }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseKeyProps['storeFile']) {
                storeFile file(releaseKeyProps['storeFile'])
                storePassword releaseKeyProps['storePassword']
                keyAlias releaseKeyProps['keyAlias']
                keyPassword releaseKeyProps['keyPassword']
            }
        }
    }
    /**
     * Per-ABI APKs instead of one universal binary.
     *
     * A universal APK bundles native libraries (Hermes, RN core, the Google
     * Play-services shims) for EVERY architecture, so a phone downloads copies
     * it can never run — that is why the universal build is ~96 MB. Splitting
     * takes the arm64 build every modern phone actually uses down to roughly a
     * third of that. Mirrors the sibling kanban app.
     *
     * `universalApk true` keeps the everything-included artifact as a fallback
     * for anyone unsure which to grab. x86_64 is kept because that is what the
     * Android emulator runs, so the build stays verifiable.
     *
     * The splits are for the APKs on GitHub releases only. Google Play takes an
     * app bundle (`bundleRelease`), one artifact carrying every ABI from which
     * Play makes per-device splits itself, so the splits turn themselves off
     * for bundle tasks: with both on, the bundle fails with "Multiple
     * shrunk-resources files found". `-PabiSplits=` overrides either way.
     * Mirrors the sibling kanban app.
     */
    def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
    def abiSplits = (findProperty('abiSplits') ?: (!isBundleBuild).toString()).toBoolean()
    splits {
        abi {
            enable abiSplits
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            /**
             * A separate package, so a dev build and the store build coexist.
             *
             * Android keys an install on applicationId, so without this the two
             * collide: same package, different signature, and installing either
             * one simply fails until the other is uninstalled. Suffixing debug
             * makes them independent apps that can sit side by side.
             *
             * The cost is that `com.sabeelinstitute.lms.debug` is a DIFFERENT
             * app to Firebase and needs its own registration with the debug
             * SHA-1, or the google-services plugin fails the build outright with
             * "No matching client found for package name".
             *
             * `expo run:android` does not know about this: it reads the
             * applicationId with a regex over the `applicationId` line alone and
             * would install the .debug APK, then try to launch the unsuffixed
             * package. Hence `--app-id` in the android script.
             */
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

/**
 * Fail closed. Left to itself, AGP packages a release whose signing config has
 * no keystore as an UNSIGNED artifact rather than failing, so a missing key
 * shows up later, or not at all. A release packaging or signing task stops
 * here instead, naming the file it looked for. The pre-merge build removes the
 * release signing config on purpose (ci-tools' `ci-premerge`) to build an
 * unsigned bundle with no secrets, and passes.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseSigning = android.buildTypes.release.signingConfig
    def packagesRelease = graph.allTasks.any { it.project == project && it.name ==~ /^(package|sign)Release(Bundle)?$/ }
    if (packagesRelease && releaseSigning != null && releaseSigning.storeFile == null) {
        throw new GradleException(
            "No release key: ${System.getenv('SABEEL_KEYSTORE_PROPERTIES') ?: '~/.config/sabeel-lms/keystore.properties'} " +
            "is missing or names no storeFile. Restore it from the vault (docs/SECRETS.md); a release is never " +
            "signed with the debug key, and never left unsigned.")
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * R8 renames the Java and Kotlin classes of a release build, so a native crash
 * reads as obfuscated frames unless Sentry holds that build's mapping file.
 * Sentry's Android Gradle plugin stamps each minified build with a UUID the SDK
 * reports with every event, and uploads the build's mapping under it.
 *
 * It uploads under the same gate as sentry.gradle above: the build machine's
 * app/.env.sentry-build-plugin (BUILD_ENV in CI), which reaches sentry-cli as
 * SENTRY_DOTENV_PATH, never on a command line, with SENTRY_ORG and
 * SENTRY_PROJECT set by `sabeel-ci build-aab` and `release`. Without the file,
 * or with SENTRY_DISABLE_AUTO_UPLOAD=true (the pre-merge builds), a release
 * build still carries its UUID and keeps its mapping, and uploads nothing. The
 * SDK itself comes from @sentry/react-native, so the plugin installs none and
 * instruments nothing, and it sends Sentry no telemetry about the build.
 */
def sentryBuildEnv = file("$projectRoot/.env.sentry-build-plugin")
sentry {
    includeProguardMapping = true
    autoUploadProguardMapping = sentryBuildEnv.exists() && System.getenv('SENTRY_DISABLE_AUTO_UPLOAD') != 'true'
    uploadNativeSymbols = false
    includeNativeSources = false
    includeSourceContext = false
    telemetry = false
    tracingInstrumentation {
        enabled = false
    }
    autoInstallation {
        enabled = false
    }
}
tasks.withType(io.sentry.android.gradle.tasks.SentryCliExecTask).configureEach {
    if (sentryBuildEnv.exists()) environment('SENTRY_DOTENV_PATH', sentryBuildEnv.absolutePath)
}
